<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Bienvenido · Manuales y videos de tu equipo</title>
<meta name="description" content="Manuales y videos de los equipos que compraste." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --acento: #D8192F; --acento-suave: rgba(216,25,47,0.08); --tinta: #1C1D1F; --gris: #5F6368; --linea: #E6E7E9; --fondo: #F6F6F4; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; background: var(--fondo); color: var(--tinta); }
  a { color: var(--acento); }
  .cabecera { background: #1C1D1F; color: #fff; padding: 28px 20px 70px; position: relative; overflow: hidden; }
  .cabecera::after { content: ""; position: absolute; right: -80px; top: -80px; width: 260px; height: 260px; border-radius: 50%;
    background: radial-gradient(circle, var(--acento) 0%, transparent 70%); opacity: .35; }
  .cab-in { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
  .marca { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .marca img { max-height: 42px; max-width: 160px; background: #fff; border-radius: 8px; padding: 4px 8px; }
  .marca span { font-weight: 600; letter-spacing: .02em; opacity: .9; }
  h1 { font-size: clamp(26px, 6vw, 38px); line-height: 1.1; margin: 0 0 12px; font-weight: 700; }
  .mensaje { font-size: 16px; line-height: 1.55; color: #D9DADC; margin: 0; max-width: 600px; white-space: pre-line; }
  main { max-width: 760px; margin: -48px auto 40px; padding: 0 16px; position: relative; z-index: 2; }
  .tarjeta { background: #fff; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 22px; margin-bottom: 18px; }
  .buscar label { font-weight: 600; font-size: 15px; display: block; margin-bottom: 4px; }
  .buscar .ayuda { font-size: 13px; color: var(--gris); margin: 0 0 14px; }
  .fila { display: flex; gap: 10px; }
  input[type=text] { flex: 1; font: inherit; font-size: 18px; padding: 14px 16px; border: 2px solid var(--linea); border-radius: 12px; outline: none;
    text-transform: uppercase; letter-spacing: .04em; min-width: 0; }
  input[type=text]:focus { border-color: var(--acento); }
  button.principal { font: inherit; font-weight: 600; font-size: 16px; background: var(--acento); color: #fff; border: 0; border-radius: 12px;
    padding: 0 22px; cursor: pointer; white-space: nowrap; }
  button.principal:disabled { opacity: .6; cursor: wait; }
  .error { color: #B3261E; background: #FCEEEE; border-radius: 10px; padding: 10px 12px; font-size: 14px; margin-top: 12px; display: none; }
  .saludo { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .docs { font-size: 13px; color: var(--gris); margin: 0; }
  .docs b { color: var(--tinta); }
  .otro { font-size: 13px; background: none; border: 0; color: var(--acento); cursor: pointer; padding: 0; margin-top: 8px; font-family: inherit; }
  .equipo { padding: 0; overflow: hidden; }
  .equipo-cab { padding: 20px 22px 14px; border-bottom: 1px solid var(--linea); }
  .etiqueta { display: inline-block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em;
    color: var(--acento); background: var(--acento-suave); padding: 3px 9px; border-radius: 99px; margin-bottom: 8px; }
  .equipo h2 { margin: 0; font-size: 21px; }
  .equipo .desc { margin: 6px 0 0; color: var(--gris); font-size: 14px; line-height: 1.5; }
  .seccion { padding: 16px 22px; }
  .seccion + .seccion { border-top: 1px solid var(--linea); }
  .seccion h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--gris); margin: 0 0 12px; font-weight: 600; }
  .doc { display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--linea); border-radius: 12px; text-decoration: none;
    color: var(--tinta); margin-bottom: 8px; }
  .doc:hover { border-color: var(--acento); }
  .doc .ico { width: 40px; height: 40px; border-radius: 10px; background: var(--acento-suave); color: var(--acento); display: grid; place-items: center;
    font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .doc .t { font-weight: 600; font-size: 15px; }
  .doc .s { font-size: 12px; color: var(--gris); }
  .doc .flecha { margin-left: auto; color: var(--gris); font-size: 20px; }
  .videos { display: grid; gap: 14px; }
  .video .marco { position: relative; padding-top: 56.25%; border-radius: 12px; overflow: hidden; background: #000; cursor: pointer; }
  .video .marco img, .video .marco iframe { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; }
  .video .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .video .play span { width: 64px; height: 64px; border-radius: 50%; background: rgba(0,0,0,.65); display: grid; place-items: center; }
  .video .play span::before { content: ""; border-left: 20px solid #fff; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 5px; }
  .video .vt { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; font-size: 14px; font-weight: 600; }
  .video .vt a { font-weight: 400; font-size: 12px; white-space: nowrap; }
  .vacio { text-align: center; color: var(--gris); font-size: 15px; line-height: 1.6; }
  .wa { display: flex; align-items: center; justify-content: center; gap: 10px; background: #1FA855; color: #fff; text-decoration: none; font-weight: 600;
    border-radius: 12px; padding: 14px; font-size: 16px; }
  footer { text-align: center; font-size: 12px; color: var(--gris); padding: 10px 16px 30px; }
  .cargando { text-align: center; color: var(--gris); padding: 20px; }
  @media (max-width: 480px) { .fila { flex-direction: column; } button.principal { padding: 14px; } }
</style>
</head>
<body>
<div class="cabecera">
  <div class="cab-in">
    <div class="marca" id="marca"></div>
    <h1 id="titulo">¡Bienvenido!</h1>
    <p class="mensaje" id="mensaje"></p>
  </div>
</div>

<main>
  <section class="tarjeta buscar" id="cajaBuscar">
    <label for="folio">Folio de tu compra</label>
    <p class="ayuda">Escríbelo como aparece en tu pedido, factura o remisión (por ejemplo <b>P0012345</b>).</p>
    <form class="fila" id="formFolio">
      <input type="text" id="folio" autocomplete="off" inputmode="text" placeholder="Ej. P0012345" maxlength="30" />
      <button class="principal" id="btnBuscar" type="submit">Ver mis manuales</button>
    </form>
    <div class="error" id="error"></div>
  </section>

  <div id="resultado"></div>
  <div id="contacto"></div>
</main>
<footer id="pie"></footer>

<script>
const partes = location.pathname.split('/').filter(Boolean);
const CODIGO = partes[0] === 'bienvenida' && partes[1] ? decodeURIComponent(partes[1]) : '';
const TOKEN = new URLSearchParams(location.search).get('t');
let INFO = null;

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function nombreBonito(s) { return String(s || '').toLowerCase().replace(/(^|[\s.'-])\S/g, m => m.toUpperCase()); }
function guardar(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }
function leer(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

async function pedir(url, opts) {
  const r = await fetch(url, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.detail || 'No pudimos cargar la información. Intenta de nuevo.');
  return d;
}

async function iniciar() {
  try {
    INFO = await pedir(`/api/publico/bienvenida/info${CODIGO ? `?codigo=${encodeURIComponent(CODIGO)}` : ''}`);
  } catch (e) {
    document.getElementById('titulo').textContent = 'Página no disponible';
    document.getElementById('cajaBuscar').style.display = 'none';
    return;
  }
  if (INFO.color && /^#[0-9a-f]{6}$/i.test(INFO.color)) {
    document.documentElement.style.setProperty('--acento', INFO.color);
    const n = parseInt(INFO.color.slice(1), 16);
    document.documentElement.style.setProperty('--acento-suave', `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},0.09)`);
  }
  document.title = `${INFO.empresa} · Manuales y videos de tu equipo`;
  document.getElementById('marca').innerHTML = (INFO.tiene_logo ? `<img src="/api/publico/bienvenida/logo?codigo=${encodeURIComponent(INFO.codigo)}" alt="" onerror="this.remove()" />` : '') + `<span>${esc(INFO.empresa)}</span>`;
  document.getElementById('titulo').textContent = INFO.titulo || '¡Bienvenido!';
  document.getElementById('mensaje').textContent = INFO.mensaje || '';
  document.getElementById('pie').textContent = `© ${new Date().getFullYear()} ${INFO.empresa}`;
  pintarContacto(INFO.whatsapp);
  if (TOKEN) return consultar({ token: TOKEN });
  const ultimo = leer('bienvenida_folio');
  if (ultimo) { document.getElementById('folio').value = ultimo; consultar({ folio: ultimo }, true); }
}

function pintarContacto(wa) {
  document.getElementById('contacto').innerHTML = wa ? `
    <section class="tarjeta">
      <p style="margin:0 0 12px; font-weight:600;">¿Tienes dudas con tu equipo?</p>
      <a class="wa" href="https://wa.me/${esc(wa)}?text=${encodeURIComponent('Hola, tengo una duda con mi equipo.')}" target="_blank" rel="noopener">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.1 5.1 0 0 0 1.1 2.7 11.7 11.7 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .2-1.2c-.1-.1-.3-.2-.5-.3z"/></svg>
        Escríbenos por WhatsApp
      </a>
    </section>` : '';
}

async function consultar(datos, silencioso = false) {
  const btn = document.getElementById('btnBuscar');
  const err = document.getElementById('error');
  err.style.display = 'none';
  btn.disabled = true; btn.textContent = 'Buscando…';
  document.getElementById('resultado').innerHTML = '<p class="cargando">Buscando tu compra…</p>';
  try {
    const d = await pedir('/api/publico/bienvenida/consultar', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ codigo: CODIGO || (INFO && INFO.codigo) || null, ...datos }),
    });
    if (datos.folio) guardar('bienvenida_folio', datos.folio);
    pintarResultado(d, !!datos.token);
    if (d.whatsapp) pintarContacto(d.whatsapp);
  } catch (e) {
    document.getElementById('resultado').innerHTML = '';
    if (datos.folio) guardar('bienvenida_folio', null);
    document.getElementById('cajaBuscar').style.display = '';
    if (!silencioso) { err.textContent = e.message; err.style.display = 'block'; }
  } finally {
    btn.disabled = false; btn.textContent = 'Ver mis manuales';
  }
}

function pintarResultado(d, conLiga) {
  document.getElementById('cajaBuscar').style.display = 'none';
  const docs = (d.documentos || []).map(x => `${esc(x.tipo)} <b>${esc(x.folio)}</b>`).join(' · ');
  let html = `
    <section class="tarjeta">
      <p class="saludo">${d.saludo ? `¡Hola, Dr(a). ${esc(nombreBonito(d.saludo))}!` : '¡Listo! Encontramos tu compra'}</p>
      <p class="docs">${docs}</p>
      <button class="otro" onclick="otroFolio()">Consultar otro folio</button>
    </section>`;
  if (!(d.equipos || []).length) {
    html += `<section class="tarjeta vacio">Todavía no tenemos manuales cargados para tu compra.<br>Escríbenos y te los enviamos.</section>`;
  }
  for (const e of d.equipos || []) {
    const pdfs = e.recursos.filter(r => r.tipo === 'pdf');
    const videos = e.recursos.filter(r => r.tipo === 'video');
    const ligas = e.recursos.filter(r => r.tipo === 'link');
    html += `
      <section class="tarjeta equipo">
        <div class="equipo-cab">
          <span class="etiqueta">${esc(e.general ? 'Para todos nuestros clientes' : (e.categoria || 'Tu equipo'))}</span>
          <h2>${esc(e.nombre)}</h2>
          ${e.descripcion ? `<p class="desc">${esc(e.descripcion)}</p>` : ''}
        </div>
        ${pdfs.length ? `<div class="seccion"><h3>Manuales</h3>${pdfs.map(r => `
          <a class="doc" href="${esc(r.url)}" target="_blank" rel="noopener">
            <span class="ico">PDF</span><span><div class="t">${esc(r.titulo)}</div><div class="s">Toca para abrir o descargar</div></span><span class="flecha">›</span>
          </a>`).join('')}</div>` : ''}
        ${videos.length ? `<div class="seccion"><h3>Videos</h3><div class="videos">${videos.map(r => `
          <div class="video">
            ${r.youtube_id ? `<div class="marco" onclick="reproducir(this, '${esc(r.youtube_id)}')">
              <img loading="lazy" src="https://i.ytimg.com/vi/${esc(r.youtube_id)}/hqdefault.jpg" alt="" onerror="this.style.visibility='hidden'" />
              <div class="play"><span></span></div></div>` : ''}
            <div class="vt"><span>${esc(r.titulo)}</span><a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir en YouTube</a></div>
          </div>`).join('')}</div></div>` : ''}
        ${ligas.length ? `<div class="seccion"><h3>Más información</h3>${ligas.map(r => `
          <a class="doc" href="${esc(r.url)}" target="_blank" rel="noopener">
            <span class="ico">↗</span><span><div class="t">${esc(r.titulo)}</div></span><span class="flecha">›</span>
          </a>`).join('')}</div>` : ''}
        ${!e.recursos.length ? `<div class="seccion vacio" style="font-size:14px;">Pronto agregaremos los manuales de este equipo.</div>` : ''}
      </section>`;
  }
  document.getElementById('resultado').innerHTML = html;
}

function reproducir(marco, id) {
  marco.onclick = null;
  marco.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
}

function otroFolio() {
  guardar('bienvenida_folio', null);
  if (TOKEN) history.replaceState(null, '', location.pathname);
  document.getElementById('resultado').innerHTML = '';
  document.getElementById('cajaBuscar').style.display = '';
  const i = document.getElementById('folio'); i.value = ''; i.focus();
}

document.getElementById('formFolio').addEventListener('submit', ev => {
  ev.preventDefault();
  const folio = document.getElementById('folio').value.trim();
  if (folio) consultar({ folio });
});
iniciar();
</script>
</body>
</html>
