<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tickets TI</title>

<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1A1B1D">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tickets TI">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --substrate: #1A1B1D;
    --panel: #232427;
    --panel-2: #2B2D30;
    --copper: #D8192F;
    --trace: #9B9D9F;
    --text: #F2F1F0;
    --muted: #9B9D9F;
    --urgente: #D8192F;
    --alta: #E8823D;
    --media: #74767A;
    --baja: #B9BABC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--substrate);
    background-image:
      linear-gradient(90deg, rgba(216,25,47,0.04) 1px, transparent 1px),
      linear-gradient(0deg, rgba(216,25,47,0.04) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 22px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 1px solid rgba(216,25,47,0.3);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .chip-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--copper);
    border: 1px solid var(--copper);
    padding: 3px 8px;
    letter-spacing: 0.1em;
  }
  h1 { font-family: 'JetBrains Mono', monospace; font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .subtitle { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .kpis { display: flex; gap: 10px; flex-wrap: wrap; }
  .kpi {
    background: var(--panel);
    border: 1px solid rgba(155,157,159,0.25);
    padding: 8px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 92px;
  }
  .kpi .n { font-size: 18px; color: var(--copper); font-weight: 700; }
  .kpi .l { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }

  button.primary {
    background: var(--copper);
    color: #fff;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    cursor: pointer;
  }
  button.primary:hover { opacity: 0.9; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    padding: 9px 14px;
    cursor: pointer;
  }
  button.danger { background: transparent; color: var(--copper); border: 1px solid var(--copper); font-family: 'JetBrains Mono', monospace; font-size: 11px; padding: 5px 10px; cursor: pointer; }

  .header-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .whoami { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); text-align: right; }
  .whoami b { color: var(--text); }

  main { padding: 22px 30px 60px; max-width: 1400px; margin: 0 auto; }

  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 980px) { .board { grid-template-columns: 1fr; } }

  .column { background: rgba(35,36,39,0.5); border: 1px solid rgba(155,157,159,0.15); min-height: 200px; }
  .column-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(155,157,159,0.2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .led { width: 8px; height: 8px; border-radius: 50%; }
  .led.abierto { background: var(--urgente); box-shadow: 0 0 6px var(--urgente); }
  .led.en_progreso { background: var(--alta); box-shadow: 0 0 6px var(--alta); }
  .led.resuelto { background: var(--media); box-shadow: 0 0 6px var(--media); }
  .led.cerrado { background: var(--baja); }

  .column-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--panel-2);
    border: 1px solid rgba(216,25,47,0.2);
    padding: 12px 12px 14px;
    cursor: pointer;
    position: relative;
  }
  .card::before, .card::after {
    content: "";
    position: absolute; left: 14px; width: 10px; height: 2px;
    background: var(--copper); opacity: 0.6;
  }
  .card::before { top: -1px; }
  .card::after { bottom: -1px; }
  .card:hover { border-color: var(--copper); }
  .card .folio { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
  .card .titulo { font-size: 13px; margin: 4px 0 8px; line-height: 1.3; font-weight: 600; }
  .card .desc-preview { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .badge { font-family: 'JetBrains Mono', monospace; padding: 2px 6px; font-size: 10px; text-transform: uppercase; }
  .badge.urgente { color: var(--urgente); border: 1px solid var(--urgente); }
  .badge.alta { color: var(--alta); border: 1px solid var(--alta); }
  .badge.media { color: var(--media); border: 1px solid var(--media); }
  .badge.baja { color: var(--baja); border: 1px solid var(--baja); }
  .card .asignado { color: var(--muted); }

  .empty-col { padding: 20px 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }

  .overlay {
    position: fixed; inset: 0; background: rgba(10,10,11,0.75);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--copper);
    max-width: 560px; width: 100%; padding: 24px;
  }
  .modal.wide { max-width: 720px; }
  .modal h2 { font-family: 'JetBrains Mono', monospace; font-size: 16px; margin: 0 0 4px; }
  .modal .folio { font-family: 'JetBrains Mono', monospace; color: var(--copper); font-size: 12px; }
  .field { margin: 14px 0; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; }
  input, textarea, select {
    width: 100%; background: var(--substrate); border: 1px solid rgba(155,157,159,0.3);
    color: var(--text); padding: 9px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;
  }
  textarea { min-height: 70px; resize: vertical; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .comentarios { border-top: 1px solid rgba(155,157,159,0.2); margin-top: 16px; padding-top: 14px; }
  .comentario { font-size: 12px; margin-bottom: 10px; }
  .comentario .autor { font-family: 'JetBrains Mono', monospace; color: var(--copper); }
  .comentario .fecha { color: var(--muted); font-size: 10px; }
  .close-btn { background: none; border: 1px solid var(--muted); color: var(--muted); font-family: 'JetBrains Mono', monospace; padding: 6px 10px; cursor: pointer; float: right; }
  .error-msg { color: var(--urgente); font-size: 12px; margin-top: 8px; font-family: 'JetBrains Mono', monospace; }

  /* Login */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .login-box { background: var(--panel); border: 1px solid var(--copper); padding: 32px; width: 100%; max-width: 340px; }
  .login-box h1 { text-align: center; margin-bottom: 4px; }
  .login-box .subtitle { text-align: center; margin-bottom: 22px; display: block; }
  .login-box button { width: 100%; margin-top: 6px; }
  .demo-hint { margin-top: 18px; font-size: 10px; color: var(--muted); font-family: 'JetBrains Mono', monospace; line-height: 1.6; border-top: 1px solid rgba(155,157,159,0.2); padding-top: 12px; }

  /* Tabla de usuarios */
  table.users { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.users th, table.users td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(155,157,159,0.2); }
  table.users th { font-family: 'JetBrains Mono', monospace; font-size: 10px; text-transform: uppercase; color: var(--muted); }
  .rol-tag { font-family: 'JetBrains Mono', monospace; font-size: 10px; padding: 2px 6px; border: 1px solid var(--trace); text-transform: uppercase; }
  .inactivo { opacity: 0.4; }
</style>
</head>
<body>

<div id="loginScreen" class="login-wrap">
  <div class="login-box">
    <h1>Tickets TI</h1>
    <span class="subtitle">inicia sesión</span>
    <div class="field"><label>Usuario</label><input id="login_user" /></div>
    <div class="field"><label>Contraseña</label><input id="login_pass" type="password" /></div>
    <button class="primary" onclick="hacerLogin()">Entrar</button>
    <div id="loginError" class="error-msg"></div>
    <div class="demo-hint">
      Usuario inicial (cámbialo en cuanto entres):<br>
      admin / cambiar123<br><br>
      Crea las cuentas de técnicos y empleados desde<br>
      "Gestionar usuarios" una vez adentro.
    </div>
  </div>
</div>

<div id="app" style="display:none;">
  <header>
    <div class="brand">
      <span class="chip-id">TI//SOP</span>
      <div>
        <h1>Tickets TI</h1>
        <div class="subtitle">tablero de soporte técnico</div>
      </div>
    </div>
    <div class="kpis" id="kpis"></div>
    <div class="header-actions">
      <div class="whoami" id="whoami"></div>
      <button class="secondary" id="btnUsuarios" onclick="abrirUsuarios()" style="display:none;">Gestionar usuarios</button>
      <button class="primary" onclick="abrirCrear()">+ NUEVO TICKET</button>
      <button class="secondary" onclick="cerrarSesion()">Salir</button>
    </div>
  </header>

  <main>
    <div class="board" id="board"></div>
  </main>
</div>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const API = "";
let META = { estados: [], prioridades: [], categorias: [], departamentos: [], roles: [] };
let SESION = null; // { token, usuario: {id, username, nombre, rol} }
let TECNICOS = [];
const NOMBRES_ESTADO = { abierto: "Abierto", en_progreso: "En progreso", resuelto: "Resuelto", cerrado: "Cerrado" };
const NOMBRES_ROL = { admin: "Administrador", tecnico: "Técnico", usuario: "Empleado" };

function headers(json = true) {
  const h = {};
  if (json) h['Content-Type'] = 'application/json';
  if (SESION) h['Authorization'] = `Bearer ${SESION.token}`;
  return h;
}

async function api(path, opts = {}) {
  const r = await fetch(`${API}${path}`, { ...opts, headers: headers(!!opts.body || !opts.method || opts.method === 'GET') });
  if (r.status === 401) { cerrarSesion(); throw new Error('Sesión expirada'); }
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.detail || 'Error'); }
  return r.status === 204 ? null : r.json();
}

// ---- Login ----

async function hacerLogin() {
  const username = document.getElementById('login_user').value.trim();
  const password = document.getElementById('login_pass').value;
  document.getElementById('loginError').textContent = '';
  try {
    const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
    SESION = data;
    localStorage.setItem('sesion_tickets_ti', JSON.stringify(data));
    await iniciarApp();
  } catch (e) {
    document.getElementById('loginError').textContent = 'Usuario o contraseña incorrectos';
  }
}

function cerrarSesion() {
  SESION = null;
  localStorage.removeItem('sesion_tickets_ti');
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginScreen').style.display = 'flex';
}

async function iniciarApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('whoami').innerHTML = `<b>${escapeHtml(SESION.usuario.nombre)}</b><br>${NOMBRES_ROL[SESION.usuario.rol]}`;
  document.getElementById('btnUsuarios').style.display = SESION.usuario.rol === 'admin' ? 'inline-block' : 'none';

  await cargarMeta();
  if (SESION.usuario.rol !== 'usuario') {
    TECNICOS = await api('/api/usuarios/tecnicos');
    await cargarKpis();
    document.getElementById('kpis').style.display = 'flex';
  } else {
    document.getElementById('kpis').style.display = 'none';
  }
  await cargarTablero();
}

async function cargarMeta() {
  META = await api('/api/meta');
}

async function cargarKpis() {
  const s = await api('/api/stats');
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><span class="n">${s.total}</span><span class="l">Total</span></div>
    <div class="kpi"><span class="n" style="color:var(--urgente)">${s.urgentes_abiertos}</span><span class="l">Urgentes abiertos</span></div>
    <div class="kpi"><span class="n">${s.tiempo_promedio_resolucion_horas}h</span><span class="l">Prom. resolución</span></div>
  `;
}

async function cargarTablero() {
  const tickets = await api('/api/tickets');
  const board = document.getElementById('board');
  board.innerHTML = META.estados.map(estado => {
    const col = tickets.filter(t => t.estado === estado);
    return `
      <div class="column">
        <div class="column-head"><span class="led ${estado}"></span> ${NOMBRES_ESTADO[estado]} (${col.length})</div>
        <div class="column-body">
          ${col.length ? col.map(cardHtml).join('') : '<div class="empty-col">— sin tickets —</div>'}
        </div>
      </div>
    `;
  }).join('');
}

function cardHtml(t) {
  return `
    <div class="card" onclick="abrirDetalle(${t.id})">
      <div class="folio">${t.folio}</div>
      <div class="titulo">${escapeHtml(t.departamento)}</div>
      <div class="desc-preview">${escapeHtml(t.descripcion.slice(0, 70))}${t.descripcion.length > 70 ? '…' : ''}</div>
      <div class="meta">
        <span class="badge ${t.prioridad}">${t.prioridad}</span>
        <span class="asignado">${t.asignado_a_nombre ? t.asignado_a_nombre : 'sin asignar'}</span>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : s;
  return d.innerHTML;
}

function abrirModal(wide = false) {
  document.getElementById('modalContent').className = wide ? 'modal wide' : 'modal';
  document.getElementById('overlay').classList.add('open');
}
function cerrarModal() { document.getElementById('overlay').classList.remove('open'); }

// ---- Crear ticket ----

function abrirCrear() {
  document.getElementById('modalContent').innerHTML = `
    <button class="close-btn" onclick="cerrarModal()">cerrar</button>
    <h2>Nuevo ticket</h2>
    <div class="field"><label>Departamento</label>
      <select id="f_depto">${META.departamentos.map(d => `<option value="${d}">${d}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Descripción</label><textarea id="f_desc" placeholder="Describe el problema..."></textarea></div>
    <div class="row-2">
      <div class="field"><label>Categoría</label>
        <select id="f_cat">${META.categorias.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Prioridad</label>
        <select id="f_pri">${META.prioridades.map(p => `<option value="${p}" ${p==='media'?'selected':''}>${p}</option>`).join('')}</select>
      </div>
    </div>
    <button class="primary" style="width:100%; margin-top:6px;" onclick="crearTicket()">Crear ticket</button>
    <div id="crearError" class="error-msg"></div>
  `;
  abrirModal();
}

async function crearTicket() {
  const payload = {
    departamento: document.getElementById('f_depto').value,
    descripcion: document.getElementById('f_desc').value.trim(),
    categoria: document.getElementById('f_cat').value,
    prioridad: document.getElementById('f_pri').value,
  };
  if (!payload.descripcion) { document.getElementById('crearError').textContent = 'Falta la descripción'; return; }
  try {
    await api('/api/tickets', { method: 'POST', body: JSON.stringify(payload) });
    cerrarModal();
    await Promise.all([cargarTablero(), SESION.usuario.rol !== 'usuario' ? cargarKpis() : Promise.resolve()]);
  } catch (e) {
    document.getElementById('crearError').textContent = e.message;
  }
}

// ---- Detalle / edición de ticket ----

async function abrirDetalle(id) {
  const t = await api(`/api/tickets/${id}`);
  const esStaff = SESION.usuario.rol !== 'usuario';

  const controlesStaff = esStaff ? `
    <div class="row-2">
      <div class="field"><label>Estado</label>
        <select id="d_estado">${META.estados.map(e => `<option value="${e}" ${e===t.estado?'selected':''}>${NOMBRES_ESTADO[e]}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Prioridad</label>
        <select id="d_prioridad">${META.prioridades.map(p => `<option value="${p}" ${p===t.prioridad?'selected':''}>${p}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>Asignado a</label>
      <select id="d_asignado">
        <option value="">— sin asignar —</option>
        ${TECNICOS.map(tec => `<option value="${tec.id}" ${t.asignado_a_id===tec.id?'selected':''}>${escapeHtml(tec.nombre_completo)}</option>`).join('')}
      </select>
    </div>
    <button class="primary" onclick="guardarCambios(${t.id})">Guardar cambios</button>
  ` : `
    <div class="field"><label>Estado</label><div>${NOMBRES_ESTADO[t.estado]}</div></div>
    <div class="field"><label>Asignado a</label><div>${t.asignado_a_nombre || 'sin asignar todavía'}</div></div>
  `;

  document.getElementById('modalContent').innerHTML = `
    <button class="close-btn" onclick="cerrarModal()">cerrar</button>
    <div class="folio">${t.folio}</div>
    <h2>${escapeHtml(t.departamento)}</h2>
    <p style="font-size:13px; color:var(--muted);">${escapeHtml(t.descripcion)}</p>
    <p style="font-size:12px; color:var(--muted);">Solicitado por <b style="color:var(--text)">${escapeHtml(t.solicitante_nombre)}</b></p>

    ${controlesStaff}

    <div class="comentarios">
      <label style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase;">Bitácora</label>
      ${t.comentarios.length ? t.comentarios.map(c => `
        <div class="comentario">
          <span class="autor">${escapeHtml(c.autor_nombre)}</span> · <span class="fecha">${c.creado_en}</span>
          <div>${escapeHtml(c.texto)}</div>
        </div>
      `).join('') : '<div class="comentario" style="color:var(--muted)">Sin comentarios aún.</div>'}
      <div class="field"><label>Agregar comentario</label><textarea id="d_comentario_texto" placeholder="Escribe una actualización..."></textarea></div>
      <button class="primary" onclick="comentar(${t.id})">Comentar</button>
    </div>
  `;
  abrirModal();
}

async function guardarCambios(id) {
  const asignadoVal = document.getElementById('d_asignado').value;
  const payload = {
    estado: document.getElementById('d_estado').value,
    prioridad: document.getElementById('d_prioridad').value,
    asignado_a_id: asignadoVal ? parseInt(asignadoVal) : null,
  };
  await api(`/api/tickets/${id}`, { method: 'PATCH', body: JSON.stringify(payload) });
  cerrarModal();
  await Promise.all([cargarTablero(), cargarKpis()]);
}

async function comentar(id) {
  const texto = document.getElementById('d_comentario_texto').value.trim();
  if (!texto) return;
  await api(`/api/tickets/${id}/comentarios`, { method: 'POST', body: JSON.stringify({ texto }) });
  abrirDetalle(id);
}

// ---- Gestión de usuarios (admin) ----

async function abrirUsuarios() {
  const usuarios = await api('/api/usuarios');
  renderUsuarios(usuarios);
  abrirModal(true);
}

function renderUsuarios(usuarios) {
  document.getElementById('modalContent').innerHTML = `
    <button class="close-btn" onclick="cerrarModal()">cerrar</button>
    <h2>Gestionar usuarios</h2>
    <table class="users">
      <thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th>WhatsApp</th><th></th></tr></thead>
      <tbody>
        ${usuarios.map(u => `
          <tr class="${u.activo ? '' : 'inactivo'}">
            <td>${escapeHtml(u.nombre_completo)}</td>
            <td>${escapeHtml(u.username)}</td>
            <td><span class="rol-tag">${NOMBRES_ROL[u.rol]}</span></td>
            <td>${u.telefono_whatsapp ? escapeHtml(u.telefono_whatsapp) : '—'}</td>
            <td>${u.activo ? `<button class="danger" onclick="desactivarUsuario(${u.id})">Desactivar</button>` : `<button class="secondary" onclick="reactivarUsuario(${u.id})">Reactivar</button>`}</td>
          </tr>
        `).join('')}
      </tbody>
    </table>

    <div class="comentarios">
      <label style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase;">Nuevo usuario</label>
      <div class="row-2">
        <div class="field"><label>Nombre completo</label><input id="u_nombre" /></div>
        <div class="field"><label>Usuario (username)</label><input id="u_username" /></div>
      </div>
      <div class="row-2">
        <div class="field"><label>Contraseña</label><input id="u_password" type="password" /></div>
        <div class="field"><label>Rol</label>
          <select id="u_rol" onchange="document.getElementById('u_tel_wrap').style.display = this.value==='tecnico' ? 'block' : 'none'">
            ${META.roles.map(r => `<option value="${r}">${NOMBRES_ROL[r]}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field" id="u_tel_wrap" style="display:none;">
        <label>WhatsApp (para notificaciones, formato +52155...)</label>
        <input id="u_telefono" placeholder="+5215512345678" />
      </div>
      <button class="primary" style="width:100%;" onclick="crearUsuarioNuevo()">Crear usuario</button>
      <div id="usuarioError" class="error-msg"></div>
    </div>
  `;
}

async function crearUsuarioNuevo() {
  const payload = {
    nombre_completo: document.getElementById('u_nombre').value.trim(),
    username: document.getElementById('u_username').value.trim(),
    password: document.getElementById('u_password').value,
    rol: document.getElementById('u_rol').value,
    telefono_whatsapp: document.getElementById('u_telefono').value.trim() || null,
  };
  if (!payload.nombre_completo || !payload.username || payload.password.length < 6) {
    document.getElementById('usuarioError').textContent = 'Revisa los campos (contraseña mínimo 6 caracteres)';
    return;
  }
  try {
    await api('/api/usuarios', { method: 'POST', body: JSON.stringify(payload) });
    TECNICOS = await api('/api/usuarios/tecnicos');
    await abrirUsuarios();
  } catch (e) {
    document.getElementById('usuarioError').textContent = e.message;
  }
}

async function desactivarUsuario(id) {
  if (!confirm('¿Desactivar este usuario? Ya no podrá iniciar sesión.')) return;
  await api(`/api/usuarios/${id}`, { method: 'DELETE' });
  TECNICOS = await api('/api/usuarios/tecnicos');
  await abrirUsuarios();
}

async function reactivarUsuario(id) {
  await api(`/api/usuarios/${id}`, { method: 'PATCH', body: JSON.stringify({ activo: true }) });
  TECNICOS = await api('/api/usuarios/tecnicos');
  await abrirUsuarios();
}

document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') cerrarModal(); });

// ---- Arranque ----

(async function init() {
  const guardada = localStorage.getItem('sesion_tickets_ti');
  if (guardada) {
    try {
      SESION = JSON.parse(guardada);
      await iniciarApp();
    } catch (e) {
      cerrarSesion();
    }
  }
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>
