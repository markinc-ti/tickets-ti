<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tickets TI</title>

<!-- PWA: hace que el navegador ofrezca "instalar" la app -->
<link rel="manifest" href="/static/manifest.json">
<meta name="theme-color" content="#1A1B1D">
<link rel="icon" href="/static/icon-192.png">
<!-- iOS no lee manifest.json para el ícono/pantalla completa, necesita estas etiquetas aparte -->
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tickets TI">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --substrate: #1A1B1D;
    --panel: #232427;
    --panel-2: #2B2D30;
    --copper: #D8192F;
    --trace: #9B9D9F;
    --text: #F2F1F0;
    --muted: #9B9D9F;
    --urgente: #D8192F;
    --alta: #E8823D;
    --media: #74767A;
    --baja: #B9BABC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--substrate);
    background-image:
      linear-gradient(90deg, rgba(216,25,47,0.04) 1px, transparent 1px),
      linear-gradient(0deg, rgba(216,25,47,0.04) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  header {
    padding: 22px 30px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    border-bottom: 1px solid rgba(216,25,47,0.3);
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .chip-id {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--copper);
    border: 1px solid var(--copper);
    padding: 3px 8px;
    letter-spacing: 0.1em;
  }
  h1 { font-family: 'JetBrains Mono', monospace; font-size: 20px; margin: 0; font-weight: 700; letter-spacing: -0.01em; }
  .subtitle { font-size: 12px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

  .kpis { display: flex; gap: 10px; flex-wrap: wrap; }
  .kpi {
    background: var(--panel);
    border: 1px solid rgba(155,157,159,0.25);
    padding: 8px 14px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 92px;
  }
  .kpi .n { font-size: 18px; color: var(--copper); font-weight: 700; }
  .kpi .l { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }

  button.primary {
    background: var(--copper);
    color: #16302A;
    border: none;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    padding: 10px 16px;
    cursor: pointer;
  }
  button.primary:hover { background: #dba456; }

  main { padding: 22px 30px 60px; max-width: 1400px; margin: 0 auto; }

  .board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 980px) { .board { grid-template-columns: 1fr; } }

  .column { background: rgba(35,36,39,0.5); border: 1px solid rgba(155,157,159,0.15); min-height: 200px; }
  .column-head {
    display: flex; align-items: center; gap: 8px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(155,157,159,0.2);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
  }
  .led { width: 8px; height: 8px; border-radius: 50%; }
  .led.abierto { background: var(--urgente); box-shadow: 0 0 6px var(--urgente); }
  .led.en_progreso { background: var(--alta); box-shadow: 0 0 6px var(--alta); }
  .led.resuelto { background: var(--media); box-shadow: 0 0 6px var(--media); }
  .led.cerrado { background: var(--baja); }

  .column-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .card {
    background: var(--panel-2);
    border: 1px solid rgba(216,25,47,0.2);
    padding: 12px 12px 14px;
    cursor: pointer;
    position: relative;
  }
  .card::before, .card::after {
    content: "";
    position: absolute; left: 14px; width: 10px; height: 2px;
    background: var(--copper); opacity: 0.6;
  }
  .card::before { top: -1px; }
  .card::after { bottom: -1px; }
  .card:hover { border-color: var(--copper); }
  .card .folio { font-family: 'JetBrains Mono', monospace; font-size: 10px; color: var(--muted); }
  .card .titulo { font-size: 13px; margin: 4px 0 8px; line-height: 1.3; }
  .card .meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; }
  .badge { font-family: 'JetBrains Mono', monospace; padding: 2px 6px; font-size: 10px; text-transform: uppercase; }
  .badge.urgente { color: var(--urgente); border: 1px solid var(--urgente); }
  .badge.alta { color: var(--alta); border: 1px solid var(--alta); }
  .badge.media { color: var(--media); border: 1px solid var(--media); }
  .badge.baja { color: var(--baja); border: 1px solid var(--baja); }
  .card .asignado { color: var(--muted); }

  .empty-col { padding: 20px 14px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--muted); }

  /* Modal */
  .overlay {
    position: fixed; inset: 0; background: rgba(10,10,11,0.75);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto; z-index: 10;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel); border: 1px solid var(--copper);
    max-width: 560px; width: 100%; padding: 24px;
  }
  .modal h2 { font-family: 'JetBrains Mono', monospace; font-size: 16px; margin: 0 0 4px; }
  .modal .folio { font-family: 'JetBrains Mono', monospace; color: var(--copper); font-size: 12px; }
  .field { margin: 14px 0; }
  .field label { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 5px; font-family: 'JetBrains Mono', monospace; }
  input, textarea, select {
    width: 100%; background: var(--substrate); border: 1px solid rgba(155,157,159,0.3);
    color: var(--text); padding: 9px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 13px;
  }
  textarea { min-height: 70px; resize: vertical; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .comentarios { border-top: 1px solid rgba(155,157,159,0.2); margin-top: 16px; padding-top: 14px; }
  .comentario { font-size: 12px; margin-bottom: 10px; }
  .comentario .autor { font-family: 'JetBrains Mono', monospace; color: var(--trace); }
  .comentario .fecha { color: var(--muted); font-size: 10px; }
  .close-btn { background: none; border: 1px solid var(--muted); color: var(--muted); font-family: 'JetBrains Mono', monospace; padding: 6px 10px; cursor: pointer; float: right; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="chip-id">TI//SOP</span>
    <div>
      <h1>Tickets TI</h1>
      <div class="subtitle">tablero de soporte técnico</div>
    </div>
  </div>
  <div class="kpis" id="kpis"></div>
  <button class="primary" onclick="abrirCrear()">+ NUEVO TICKET</button>
</header>

<main>
  <div class="board" id="board"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
const API = "";
let META = { estados: [], prioridades: [], categorias: [] };
const NOMBRES_ESTADO = { abierto: "Abierto", en_progreso: "En progreso", resuelto: "Resuelto", cerrado: "Cerrado" };

async function cargarMeta() {
  META = await (await fetch(`${API}/api/meta`)).json();
}

async function cargarKpis() {
  const s = await (await fetch(`${API}/api/stats`)).json();
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><span class="n">${s.total}</span><span class="l">Total</span></div>
    <div class="kpi"><span class="n" style="color:var(--urgente)">${s.urgentes_abiertos}</span><span class="l">Urgentes abiertos</span></div>
    <div class="kpi"><span class="n">${s.tiempo_promedio_resolucion_horas}h</span><span class="l">Prom. resolución</span></div>
  `;
}

async function cargarTablero() {
  const tickets = await (await fetch(`${API}/api/tickets`)).json();
  const board = document.getElementById('board');
  board.innerHTML = META.estados.map(estado => {
    const col = tickets.filter(t => t.estado === estado);
    return `
      <div class="column">
        <div class="column-head"><span class="led ${estado}"></span> ${NOMBRES_ESTADO[estado]} (${col.length})</div>
        <div class="column-body">
          ${col.length ? col.map(cardHtml).join('') : '<div class="empty-col">— sin tickets —</div>'}
        </div>
      </div>
    `;
  }).join('');
}

function cardHtml(t) {
  return `
    <div class="card" onclick="abrirDetalle(${t.id})">
      <div class="folio">${t.folio}</div>
      <div class="titulo">${escapeHtml(t.titulo)}</div>
      <div class="meta">
        <span class="badge ${t.prioridad}">${t.prioridad}</span>
        <span class="asignado">${t.asignado_a ? t.asignado_a : 'sin asignar'}</span>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function abrirModal() { document.getElementById('overlay').classList.add('open'); }
function cerrarModal() { document.getElementById('overlay').classList.remove('open'); }

function abrirCrear() {
  document.getElementById('modalContent').innerHTML = `
    <button class="close-btn" onclick="cerrarModal()">cerrar</button>
    <h2>Nuevo ticket</h2>
    <div class="field"><label>Título</label><input id="f_titulo" maxlength="140" /></div>
    <div class="field"><label>Descripción</label><textarea id="f_desc"></textarea></div>
    <div class="row-2">
      <div class="field"><label>Categoría</label>
        <select id="f_cat">${META.categorias.map(c => `<option value="${c}">${c}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Prioridad</label>
        <select id="f_pri">${META.prioridades.map(p => `<option value="${p}" ${p==='media'?'selected':''}>${p}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>Tu nombre</label><input id="f_solicitante" /></div>
    <button class="primary" style="width:100%; margin-top:6px;" onclick="crearTicket()">Crear ticket</button>
  `;
  abrirModal();
}

async function crearTicket() {
  const payload = {
    titulo: document.getElementById('f_titulo').value.trim(),
    descripcion: document.getElementById('f_desc').value.trim(),
    categoria: document.getElementById('f_cat').value,
    prioridad: document.getElementById('f_pri').value,
    solicitante: document.getElementById('f_solicitante').value.trim() || "Anónimo",
  };
  if (!payload.titulo || !payload.descripcion) { alert('Falta título o descripción'); return; }

  const r = await fetch(`${API}/api/tickets`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  });
  if (!r.ok) { alert('Error al crear el ticket'); return; }
  cerrarModal();
  await Promise.all([cargarTablero(), cargarKpis()]);
}

async function abrirDetalle(id) {
  const t = await (await fetch(`${API}/api/tickets/${id}`)).json();
  document.getElementById('modalContent').innerHTML = `
    <button class="close-btn" onclick="cerrarModal()">cerrar</button>
    <div class="folio">${t.folio}</div>
    <h2>${escapeHtml(t.titulo)}</h2>
    <p style="font-size:13px; color:var(--muted);">${escapeHtml(t.descripcion)}</p>
    <p style="font-size:12px; color:var(--muted);">Solicitado por <b style="color:var(--text)">${escapeHtml(t.solicitante)}</b></p>

    <div class="row-2">
      <div class="field"><label>Estado</label>
        <select id="d_estado">${META.estados.map(e => `<option value="${e}" ${e===t.estado?'selected':''}>${NOMBRES_ESTADO[e]}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Prioridad</label>
        <select id="d_prioridad">${META.prioridades.map(p => `<option value="${p}" ${p===t.prioridad?'selected':''}>${p}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field"><label>Asignado a</label><input id="d_asignado" value="${t.asignado_a || ''}" placeholder="nombre del técnico" /></div>
    <button class="primary" onclick="guardarCambios(${t.id})">Guardar cambios</button>

    <div class="comentarios">
      <label style="font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); text-transform:uppercase;">Bitácora</label>
      ${t.comentarios.length ? t.comentarios.map(c => `
        <div class="comentario">
          <span class="autor">${escapeHtml(c.autor)}</span> · <span class="fecha">${c.creado_en}</span>
          <div>${escapeHtml(c.texto)}</div>
        </div>
      `).join('') : '<div class="comentario" style="color:var(--muted)">Sin comentarios aún.</div>'}
      <div class="field"><label>Agregar comentario</label><textarea id="d_comentario_texto" placeholder="Escribe una actualización..."></textarea></div>
      <input id="d_comentario_autor" placeholder="tu nombre" style="margin-bottom:8px;" />
      <button class="primary" onclick="comentar(${t.id})">Comentar</button>
    </div>
  `;
  abrirModal();
}

async function guardarCambios(id) {
  const payload = {
    estado: document.getElementById('d_estado').value,
    prioridad: document.getElementById('d_prioridad').value,
    asignado_a: document.getElementById('d_asignado').value.trim() || null,
  };
  await fetch(`${API}/api/tickets/${id}`, {
    method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
  });
  cerrarModal();
  await Promise.all([cargarTablero(), cargarKpis()]);
}

async function comentar(id) {
  const texto = document.getElementById('d_comentario_texto').value.trim();
  const autor = document.getElementById('d_comentario_autor').value.trim() || "Anónimo";
  if (!texto) return;
  await fetch(`${API}/api/tickets/${id}/comentarios`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ autor, texto })
  });
  abrirDetalle(id);
}

document.getElementById('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') cerrarModal(); });

(async function init() {
  await cargarMeta();
  await Promise.all([cargarTablero(), cargarKpis()]);
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js').catch(() => {});
  });
}
</script>

</body>
</html>
