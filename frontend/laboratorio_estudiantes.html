<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark" />
<title>Laboratorio — Portal de estudiantes</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; color-scheme: dark; }
  :root {
    --copper-light: #F0374F; --copper-dark: #A81222; --copper: #D8192F;
    --radius-sm: 5px; --radius: 8px; --radius-lg: 14px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.45);
    --shadow-md: 0 4px 10px rgba(0,0,0,0.45);
    --shadow-inset: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 -1px 0 rgba(0,0,0,0.35);
  }
  html, body { margin:0; padding:0; min-height:100%; background:#0B0C0D; color:#EDEDED; font-family:'IBM Plex Sans','Segoe UI',sans-serif; }
  body { padding:20px 16px 60px; max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:0 0 2px; }
  h2 { font-size:16px; margin:22px 0 10px; }
  .sub { font-size:13px; color:#C4C6C9; margin-bottom:20px; }
  .card { background:linear-gradient(180deg, #17181A, #131415); border-radius:var(--radius-lg); box-shadow:var(--shadow-md), var(--shadow-inset); padding:18px; margin-bottom:16px; }
  .card.destacada { border:1px solid var(--copper); }
  .field { margin-bottom:12px; }
  label { display:block; font-size:12px; color:#C4C6C9; text-transform:uppercase; letter-spacing:0.04em; margin-bottom:5px; }
  input, select, textarea {
    width:100%; padding:11px 12px; border-radius:var(--radius); border:1px solid rgba(155,157,159,0.25);
    background:#0F1011; color:#EDEDED; font-size:15px; font-family:inherit; box-shadow:var(--shadow-inset);
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--copper); }
  textarea { resize:vertical; min-height:60px; }
  button { cursor:pointer; font-family:inherit; font-size:14px; font-weight:700; border:none; border-radius:var(--radius); padding:12px 16px; }
  button.primary { width:100%; background:linear-gradient(180deg, var(--copper-light), var(--copper-dark)); color:#fff; box-shadow:var(--shadow-md), var(--shadow-inset); }
  button.primary:active { transform: translateY(1px); }
  button.primary:disabled { opacity:0.5; }
  button.secondary { background:#1B1C1E; color:#EDEDED; border:1px solid rgba(155,157,159,0.3); }
  button.link { background:none; color:var(--copper-light); padding:6px 0; font-weight:600; }
  label.btn-file { cursor:pointer; font-family:inherit; font-size:14px; font-weight:700; border-radius:var(--radius); padding:12px 16px; background:#1B1C1E; color:#EDEDED; border:1px solid rgba(155,157,159,0.3); text-align:center; display:block; }
  .fila { display:flex; gap:10px; }
  .fila > * { flex:1; }
  .error { color:#FF6B7A; font-size:13px; min-height:16px; margin-top:6px; }
  .ok { color:#4ADE80; font-size:13px; }
  .trabajo-item { padding:14px; border-radius:var(--radius); background:#111213; box-shadow:var(--shadow-inset); margin-bottom:10px; cursor:pointer; }
  .trabajo-item:active { transform: translateY(1px); }
  .trabajo-folio { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:14px; }
  .trabajo-estado { display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; padding:3px 8px; border-radius:20px; background:rgba(216,25,47,0.18); color:var(--copper-light); margin-left:8px; }
  .trabajo-meta { font-size:12px; color:#C4C6C9; margin-top:4px; }
  .pieza-row { display:flex; gap:8px; align-items:center; padding:10px 0; border-bottom:1px solid rgba(155,157,159,0.15); }
  .pieza-row:last-child { border-bottom:none; }
  .pieza-diente { font-family:'JetBrains Mono',monospace; font-weight:700; width:34px; }
  .pieza-info { flex:1; font-size:13px; }
  .pieza-costo { font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--copper-light); }
  .empty { text-align:center; color:#9FA1A4; font-size:13px; padding:30px 0; }
  .top-actions { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .badge-precio { font-size:12px; color:#C4C6C9; margin-top:6px; }
  .badge-reporte { display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; padding:3px 8px; border-radius:20px; margin-top:6px; }
  .badge-reporte.pendiente { background:rgba(240,167,35,0.18); color:#F0A723; }
  .badge-reporte.confirmado { background:rgba(74,222,128,0.18); color:#4ADE80; }
  .badge-reporte.rechazado { background:rgba(255,107,122,0.18); color:#FF6B7A; }
  .comprobante-preview { width:90px; height:90px; object-fit:cover; border-radius:6px; margin-top:8px; }
  #firmaCanvas { width:100%; height:120px; background:#0F1011; border:1px solid rgba(155,157,159,0.3); border-radius:var(--radius); touch-action:none; cursor:crosshair; }
  #pantallaInvalida { display:none; text-align:center; padding:60px 20px; color:#C4C6C9; }
  .hidden { display:none !important; }
  /* Pedido paso a paso (Restauración → Corona → posición → parámetros) */
  .pasos { display:flex; gap:6px; margin:-4px 0 14px; }
  .pasos span { flex:1; height:4px; border-radius:4px; background:rgba(155,157,159,0.25); }
  .pasos span.on { background:var(--copper); }
  .opcion-grande { display:flex; flex-direction:column; align-items:stretch; gap:10px; width:100%; text-align:left; padding:14px; border-radius:var(--radius-lg); background:#111213; border:1px solid rgba(155,157,159,0.25); color:#EDEDED; }
  .opcion-grande:active { transform:translateY(1px); }
  .opcion-grande .ilustracion { background:#F4F4F4; border-radius:var(--radius); height:150px; display:flex; align-items:center; justify-content:center; }
  .opcion-grande .titulo { font-size:17px; font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:flex; align-items:center; gap:8px; padding:12px 16px; border-radius:var(--radius); background:#111213; border:1px solid rgba(155,157,159,0.3); color:#EDEDED; font-weight:600; }
  .chip.on { border-color:var(--copper); background:rgba(216,25,47,0.14); color:#fff; }
  .odonto { overflow-x:auto; padding-bottom:6px; }
  .odonto-fila { display:grid; grid-template-columns:repeat(16, minmax(30px, 1fr)); gap:4px; min-width:520px; margin-bottom:4px; }
  .diente { display:flex; flex-direction:column; align-items:center; gap:2px; padding:6px 0 4px; border-radius:7px; background:#F4F4F4; border:2px solid transparent; color:#222; font-size:11px; font-weight:700; cursor:pointer; user-select:none; }
  .diente svg { width:20px; height:30px; }
  .diente.on { border-color:var(--copper); background:#FFE3E6; }
  .diente.inferior { flex-direction:column-reverse; }
  .odonto-sep { height:1px; background:rgba(155,157,159,0.35); margin:6px 0 8px; min-width:520px; }
  .resumen-total { display:flex; justify-content:space-between; align-items:center; font-size:15px; padding:12px 0 4px; border-top:1px solid rgba(155,157,159,0.2); margin-top:6px; }
  .resumen-total b { font-family:'JetBrains Mono',monospace; color:var(--copper-light); font-size:18px; }
  .aviso-vigencia { border-radius:var(--radius); padding:12px 14px; margin-bottom:14px; font-size:13px; background:rgba(240,167,35,0.14); color:#F0C36D; border:1px solid rgba(240,167,35,0.4); }
</style>
</head>
<body>

<div id="pantallaInvalida">
  <h1>Enlace no válido</h1>
  <p>Pídele al laboratorio el link correcto de registro.</p>
</div>

<div id="app" class="hidden">

  <!-- ---- LOGIN / REGISTRO ---- -->
  <div id="vistaAuth">
    <h1>🧪 Laboratorio</h1>
    <div class="sub" id="nombreEmpresaSub">Portal de estudiantes</div>

    <div class="card" id="cardLogin">
      <h2 style="margin-top:0;">Iniciar sesión</h2>
      <div class="field"><label>Matrícula</label><input id="li_matricula" autocomplete="username" /></div>
      <div class="field"><label>Contraseña</label><input id="li_password" type="password" autocomplete="new-password" /></div>
      <button class="primary" onclick="iniciarSesion()">Entrar</button>
      <div class="error" id="li_error"></div>
      <button class="link" onclick="mostrarRegistro()">No tengo cuenta — registrarme con mi matrícula</button>
    </div>

    <div class="card hidden" id="cardRegistro">
      <h2 style="margin-top:0;">Crear mi cuenta</h2>
      <p class="sub" style="margin-bottom:14px;">Tu usuario de acceso es tu matrícula de la escuela — así tu cuenta queda ligada a una identificación real.</p>
      <div class="field"><label>Matrícula</label><input id="re_matricula" autocomplete="username" /></div>
      <div class="field"><label>Nombre completo</label><input id="re_nombre" autocomplete="name" /></div>
      <div class="field"><label>Teléfono (10 dígitos)</label><input id="re_telefono" autocomplete="tel" /></div>
      <div class="field"><label>Correo electrónico</label><input id="re_email" type="email" autocomplete="email" placeholder="tucorreo@ejemplo.com" /></div>
      <div class="field"><label>Contraseña (mínimo 6 caracteres)</label><input id="re_password" type="password" autocomplete="new-password" /></div>
      <button class="primary" onclick="registrarse()">Crear cuenta</button>
      <div class="error" id="re_error"></div>
      <button class="link" onclick="mostrarLogin()">Ya tengo cuenta — iniciar sesión</button>
    </div>
  </div>

  <!-- ---- MIS TRABAJOS (lista) ---- -->
  <div id="vistaLista" class="hidden">
    <div class="top-actions">
      <div>
        <h1 style="margin-bottom:0;">Mis trabajos</h1>
        <div class="sub" id="saludoUsuario" style="margin-bottom:0;"></div>
      </div>
      <button class="secondary" onclick="cerrarSesion()">Salir</button>
    </div>
    <div id="avisoVigencia"></div>
    <div id="avisoLista"></div>
    <button class="primary" onclick="mostrarNuevoTrabajo()">+ Nuevo pedido</button>
    <div id="listaTrabajos" style="margin-top:18px;"></div>
  </div>

  <!-- ---- NUEVO PEDIDO (paso a paso) ---- -->
  <div id="vistaNuevo" class="hidden">
    <div class="top-actions">
      <h1 style="margin-bottom:0;">Nuevo pedido</h1>
      <button class="secondary" onclick="pedidoAtras()">← Atrás</button>
    </div>
    <div class="pasos"><span id="paso_b1"></span><span id="paso_b2"></span><span id="paso_b3"></span></div>
    <div id="pedidoPaso"></div>
  </div>

  <!-- ---- DETALLE DE TRABAJO ---- -->
  <div id="vistaDetalle" class="hidden">
    <div class="top-actions">
      <h1 style="margin-bottom:0;">Detalle</h1>
      <button class="secondary" onclick="mostrarLista()">← Volver</button>
    </div>
    <div id="detalleContenido"></div>
  </div>

</div>

<script>
  const CODIGO = window.location.pathname.split('/').filter(Boolean).pop();
  let TOKEN = null;
  let USUARIO = null;
  let META = null;
  let TRABAJOS_CACHE = [];
  let PIEZAS_NUEVAS = [];
  let FIRMA_VACIA = true;
  let TRABAJO_DETALLE_ID = null;
  let DSCORE_PIEZAS_PENDIENTES = [];

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function fmtDinero(n) {
    return `$${(Number(n) || 0).toLocaleString('es-MX', { minimumFractionDigits: 2 })}`;
  }

  const NOMBRES_TIPO = { corona: 'Corona', implante: 'Implante', puente: 'Puente', carilla: 'Carilla', incrustacion: 'Incrustación', otro: 'Otro' };
  const NOMBRES_MATERIAL = { zirconia: 'Zirconia', disilicato: 'Disilicato' };
  const NOMBRES_ESTADO = {
    recibido: 'Recibido — falta pago y firma', en_laboratorio: 'En laboratorio', modelado: 'Modelado / diseño',
    aprobar_diseno: 'Aprobar diseño', maquila: 'Maquila (fresado)', maquillado: 'Maquillado / acabado', control_calidad: 'Control de calidad',
    envio_sucursal: 'En camino a sucursal', listo_entrega: 'Listo para entrega', entregado: 'Entregado', cancelado: 'Cancelado',
  };
  const NOMBRES_ESTADO_REPORTE = { pendiente: 'Pendiente de revisar', confirmado: 'Pago confirmado', rechazado: 'Rechazado' };

  async function api(ruta, opciones = {}) {
    const headers = { 'Content-Type': 'application/json' };
    if (TOKEN) headers['Authorization'] = `Bearer ${TOKEN}`;
    const resp = await fetch(ruta, { ...opciones, headers: { ...headers, ...(opciones.headers || {}) } });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      let mensaje = err.detail;
      // err.detail puede venir como texto (caso normal), como lista de errores de
      // validación de FastAPI (422), o como algún otro objeto -- nunca lo pasamos
      // crudo a new Error(), porque JS lo convertiría en el inútil texto "[object Object]".
      if (Array.isArray(mensaje)) {
        mensaje = mensaje.map(m => (m && typeof m === 'object') ? (m.msg || JSON.stringify(m)) : m).join('; ');
      } else if (mensaje && typeof mensaje === 'object') {
        mensaje = mensaje.msg || JSON.stringify(mensaje);
      }
      if (resp.status === 401 && TOKEN && !ruta.startsWith('/api/auth/login')) {
        cerrarSesion();
        document.getElementById('li_error').textContent = mensaje || 'Tu sesión terminó, vuelve a entrar.';
      }
      throw new Error(mensaje || 'Ocurrió un error, intenta de nuevo.');
    }
    return resp.status === 204 ? null : resp.json();
  }

  function mostrarSolo(id) {
    ['vistaAuth', 'vistaLista', 'vistaNuevo', 'vistaDetalle'].forEach(v => {
      document.getElementById(v).classList.toggle('hidden', v !== id);
    });
  }

  function mostrarLogin() {
    document.getElementById('cardRegistro').classList.add('hidden');
    document.getElementById('cardLogin').classList.remove('hidden');
  }
  function mostrarRegistro() {
    document.getElementById('cardLogin').classList.add('hidden');
    document.getElementById('cardRegistro').classList.remove('hidden');
  }

  async function iniciarSesion() {
    const err = document.getElementById('li_error');
    err.textContent = '';
    const username = document.getElementById('li_matricula').value.trim();
    const password = document.getElementById('li_password').value;
    if (!username || !password) { err.textContent = 'Completa tu matrícula y contraseña.'; return; }
    try {
      const datos = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ username, password }) });
      if (datos.usuario.rol !== 'estudiante') {
        err.textContent = 'Esta cuenta no es de estudiante.';
        return;
      }
      sesionIniciada(datos);
    } catch (e) { err.textContent = e.message; }
  }

  async function registrarse() {
    const err = document.getElementById('re_error');
    err.textContent = '';
    const payload = {
      matricula: document.getElementById('re_matricula').value.trim(),
      nombre_completo: document.getElementById('re_nombre').value.trim(),
      telefono: document.getElementById('re_telefono').value.trim(),
      email: document.getElementById('re_email').value.trim(),
      password: document.getElementById('re_password').value,
    };
    if (!payload.matricula || !payload.nombre_completo || !payload.telefono || !payload.email || !payload.password) {
      err.textContent = 'Completa todos los campos.'; return;
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]{2,}$/.test(payload.email)) { err.textContent = 'Revisa tu correo electrónico.'; return; }
    try {
      const datos = await api(`/api/laboratorio/estudiantes/registro/${CODIGO}`, { method: 'POST', body: JSON.stringify(payload) });
      sesionIniciada(datos);
    } catch (e) { err.textContent = e.message; }
  }

  function sesionIniciada(datos) {
    TOKEN = datos.token;
    USUARIO = datos.usuario;
    localStorage.setItem('lab_estudiante_token', TOKEN);
    document.getElementById('saludoUsuario').textContent = `${USUARIO.nombre} · ${USUARIO.username}`;
    cargarMeta();
    mostrarLista();
  }

  function cerrarSesion() {
    TOKEN = null; USUARIO = null;
    localStorage.removeItem('lab_estudiante_token');
    mostrarSolo('vistaAuth');
    mostrarLogin();
  }

  async function cargarMeta() {
    try { META = await api('/api/meta'); } catch (e) { META = null; }
  }

  async function mostrarLista() {
    mostrarSolo('vistaLista');
    document.getElementById('avisoLista').innerHTML = '';
    cargarAvisoVigencia();
    const cont = document.getElementById('listaTrabajos');
    cont.innerHTML = '<div class="empty">Cargando…</div>';
    try {
      TRABAJOS_CACHE = await api('/api/laboratorio/mios');
      if (!TRABAJOS_CACHE.length) {
        cont.innerHTML = '<div class="empty">Todavía no tienes ningún trabajo — crea el primero arriba.</div>';
        return;
      }
      cont.innerHTML = TRABAJOS_CACHE.map(w => `
        <div class="trabajo-item" onclick="verDetalle(${w.id})">
          <div><span class="trabajo-folio">${escapeHtml(w.folio)}</span><span class="trabajo-estado">${escapeHtml(NOMBRES_ESTADO[w.estado] || w.estado)}</span></div>
          <div class="trabajo-meta">${w.piezas.length} pieza(s) · costo total ${fmtDinero(w.costo_total)}${w.pago_registrado_en ? ' · pago registrado' : ' · falta registrar pago'}</div>
        </div>
      `).join('');
    } catch (e) {
      cont.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
    }
  }

  // ---------- Pedido paso a paso ----------
  // Restauración → Corona → Posición (odontograma FDI, varios dientes) →
  // Tipo de servicio / Unidad de producción / Clase de material / Tono → Listo.
  const DIENTES_SUP = ['18','17','16','15','14','13','12','11','21','22','23','24','25','26','27','28'];
  const DIENTES_INF = ['48','47','46','45','44','43','42','41','31','32','33','34','35','36','37','38'];
  const TONOS_VITA = ['A1','A2','A3','A3.5','A4','B1','B2','B3','B4','C1','C2','C3','C4','D2','D3','D4','BL1','BL2','BL3','BL4'];
  const TIPOS_SERVICIO = ['Diseño y fabricación'];
  const UNIDADES_PRODUCCION = ['Fresado'];
  let PEDIDO = null;

  function _svgDiente(num) {
    const pos = parseInt(num.slice(1), 10);
    // molar (6-8), premolar (4-5), canino (3), incisivo (1-2)
    const forma = pos >= 6
      ? '<path d="M3 4c0-2 3-3 5-2 1 .5 3 .5 4 0 2-1 5 0 5 2v8c0 2-1 3-2 3H5c-1 0-2-1-2-3z"/><path d="M5 15l-1 12c0 1 2 1 2 0l2-10M15 15l1 12c0 1-2 1-2 0l-2-10"/>'
      : pos >= 4
        ? '<path d="M5 3c0-1.5 2-2 5-2s5 .5 5 2v10c0 2-1 3-2 3H7c-1 0-2-1-2-3z"/><path d="M7 16l1 12c0 1 2 1 2 0l2-12"/>'
        : pos === 3
          ? '<path d="M6 5l4-4 4 4v9c0 2-1 3-2 3H8c-1 0-2-1-2-3z"/><path d="M8 17l1.5 12h1L12 17"/>'
          : '<path d="M6 1h8v13c0 2-1 3-2 3H8c-1 0-2-1-2-3z"/><path d="M8 17l1.5 12h1L12 17"/>';
    const inferior = num[0] === '3' || num[0] === '4';
    return `<svg viewBox="0 0 20 30" fill="#fff" stroke="#9aa0a6" stroke-width="1" ${inferior ? 'style="transform:scaleY(-1)"' : ''}>${forma}</svg>`;
  }

  function mostrarNuevoTrabajo() {
    PEDIDO = { paso: 1, procedimiento: 'corona', dientes: [], servicio: TIPOS_SERVICIO[0], unidad: UNIDADES_PRODUCCION[0],
               material: 'zirconia', tono: '', paciente: '', factura: false, notas: '', archivo: null, error: '' };
    mostrarSolo('vistaNuevo');
    renderPedido();
  }

  function pedidoAtras() {
    if (!PEDIDO || PEDIDO.paso <= 1) { mostrarLista(); return; }
    PEDIDO.paso -= 1; PEDIDO.error = '';
    renderPedido();
  }

  function pedidoIr(paso) {
    if (paso === 3 && !PEDIDO.dientes.length) { PEDIDO.error = 'Elige al menos un diente en el odontograma.'; renderPedido(); return; }
    PEDIDO.paso = paso; PEDIDO.error = '';
    renderPedido();
    window.scrollTo(0, 0);
  }

  function toggleDiente(num) {
    const i = PEDIDO.dientes.indexOf(num);
    if (i >= 0) PEDIDO.dientes.splice(i, 1); else PEDIDO.dientes.push(num);
    const orden = DIENTES_SUP.concat(DIENTES_INF);
    PEDIDO.dientes.sort((a, b) => orden.indexOf(a) - orden.indexOf(b));
    PEDIDO.error = '';
    renderPedido();
  }

  function precioPedido() {
    const unitario = precioFijoBuap('corona', PEDIDO.material) || 0;
    return { unitario, total: unitario * PEDIDO.dientes.length };
  }

  function renderPedido() {
    [1, 2, 3].forEach(n => document.getElementById('paso_b' + n).classList.toggle('on', n <= PEDIDO.paso));
    const cont = document.getElementById('pedidoPaso');
    const err = PEDIDO.error ? `<div class="error">${escapeHtml(PEDIDO.error)}</div>` : '';
    if (PEDIDO.paso === 1) {
      cont.innerHTML = `
        <p class="sub">¿Qué necesitas?</p>
        <button class="opcion-grande" onclick="pedidoIr(2)">
          <div class="ilustracion"><svg viewBox="0 0 220 110" width="220" height="110">
            <path d="M15 70c10-35 60-48 95-48s85 13 95 48c-8 25-55 32-95 32S23 95 15 70z" fill="#F2A3A8"/>

  async function crearTrabajo() {
    if (!PEDIDO.tono) { PEDIDO.error = 'Elige el tono en la guía de tonos.'; renderPedido(); return; }
    const btn = document.getElementById('btnCrearPedido');
    btn.disabled = true; btn.textContent = 'Creando pedido…';
    const detalle = `${PEDIDO.servicio} · ${PEDIDO.unidad}`;
    const payload = {
      paciente_nombre: PEDIDO.paciente.trim() || null,
      notas: [detalle, PEDIDO.notas.trim()].filter(Boolean).join(' — '),
      requiere_factura: PEDIDO.factura,
      piezas: PEDIDO.dientes.map(d => ({ diente: d, tipo_trabajo: 'corona', material: PEDIDO.material, color: PEDIDO.tono, notas: detalle, costo: 0 })),
    };
    try {
      const w = await api('/api/laboratorio/mios', { method: 'POST', body: JSON.stringify(payload) });
      let aviso = `✔ Pedido ${escapeHtml(w.folio)} creado. Sube tu comprobante de pago para que el laboratorio lo empiece.`;
      if (PEDIDO.archivo) {
        btn.textContent = 'Subiendo escaneo…';
        try {
          const fd = new FormData();
          fd.append('archivo', PEDIDO.archivo);
          const r = await fetch(`/api/laboratorio/mios/${w.id}/escaneo`, { method: 'POST', headers: { Authorization: `Bearer ${TOKEN}` }, body: fd });
          if (!r.ok) throw new Error(((await r.json().catch(() => ({}))).detail) || 'no se pudo subir');
        } catch (e) {
          aviso += ` ⚠️ El escaneo no se subió (${escapeHtml(e.message)}); súbelo desde el detalle del pedido.`;
        }
      }
      PEDIDO = null;
      await mostrarLista();
      document.getElementById('avisoLista').innerHTML = `<div class="card" style="font-size:13px; color:#4ADE80;">${aviso}</div>`;
    } catch (e) {
      PEDIDO.error = e.message;
      renderPedido();
    }
  }

    let html = '';

    if (w.estado !== 'recibido') {

          ${hayReportePendiente ? `
            <p class="badge-reporte pendiente">Reportaste un pago — pendiente de que el laboratorio lo confirme contra el banco</p>
            ${ultimoReporte.monto_detectado != null || ultimoReporte.referencia_detectada ? `
              <p class="trabajo-meta">Lo que se alcanzó a leer: ${ultimoReporte.monto_detectado != null ? fmtDinero(ultimoReporte.monto_detectado) : '—'}${ultimoReporte.referencia_detectada ? ' · ref. ' + escapeHtml(ultimoReporte.referencia_detectada) : ''}</p>
            ` : ''}
          ` : `
            ${ultimoReporte && ultimoReporte.estado === 'rechazado' ? `
              <p class="badge-reporte rechazado">Tu último comprobante fue rechazado${ultimoReporte.motivo_rechazo ? ': ' + escapeHtml(ultimoReporte.motivo_rechazo) : ''} — sube uno nuevo o pasa a la sucursal.</p>
            ` : ''}
            <p class="sub" style="margin:10px 0 8px;">Sube la foto o captura de tu comprobante de transferencia (SPEI, app del banco, etc.) — el laboratorio la revisa contra el banco antes de darla por buena. También puedes pasar a pagar en persona.</p>
            <label class="btn-file">

    if (cubierto && !w.firma_recepcion) {
      html += `

          <h2 style="margin-top:0;">Firma de recepción</h2>
          <p class="sub" style="margin-bottom:10px;">Tu pago ya está confirmado — firma aquí para que el laboratorio empiece a fabricar tu trabajo.</p>

          </div>
          <div class="error" id="firmaError"></div>
        </div>
      `;
    }

    return html;
  }

  function iniciarVisorSTL(contenedorId, base64, trabajoId, base64_2, nombre1, nombre2) {
    const cont = document.getElementById(contenedorId);
    if (!cont) return;
    const mostrarError = (msg) => {
      cont.innerHTML = `<p style="font-size:12px; color:var(--muted); padding:10px; margin:0;">${msg}</p>`;
    };
    if (typeof THREE === 'undefined' || !THREE.STLLoader) {
      mostrarError('No se pudo cargar el visor 3D — descarga el archivo para revisarlo.');
      return;
    }
    const _parseSTLBase64 = (b64) => {
      const partes = String(b64).split(',');
      const binario = atob(partes[1] || partes[0]);
      const buf = new Uint8Array(binario.length);
      for (let i = 0; i < binario.length; i++) buf[i] = binario.charCodeAt(i);
      return new THREE.STLLoader().parse(buf.buffer);
    };
    let geometry;
    try {
      geometry = _parseSTLBase64(base64);
    } catch (e) {
      mostrarError('No se pudo leer el archivo para mostrarlo.');
      return;
    }
    let geometry2 = null;
    if (base64_2) {
      try {
        geometry2 = _parseSTLBase64(base64_2);
      } catch (e) {
        geometry2 = null; // si la segunda pieza no carga, se sigue mostrando la primera sola
      }
    }
    try {
      cont.innerHTML = '';
      const ancho = cont.clientWidth || 300;
      const alto = cont.clientHeight || 260;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x12151a);
      const camera = new THREE.PerspectiveCamera(45, ancho / alto, 0.1, 5000);
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(ancho, alto);
      cont.appendChild(renderer.domElement);
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const luz1 = new THREE.DirectionalLight(0xffffff, 0.9);
      luz1.position.set(1, 1, 1);
      scene.add(luz1);
      const luz2 = new THREE.DirectionalLight(0xffffff, 0.5);
      luz2.position.set(-1, -0.6, -1);
      scene.add(luz2);
      geometry.computeBoundingBox();
      const cajaUnion = geometry.boundingBox.clone();
      if (geometry2) {
        geometry2.computeBoundingBox();
        cajaUnion.union(geometry2.boundingBox);
      }
      // Las 2 piezas se centran con el MISMO offset (el centro de la caja
      // que las contiene a ambas) -- así se mueven juntas y conservan su
      // posición relativa real (ej. cómo encaja la arcada superior con la
      // inferior), en vez de quedar cada una centrada por su cuenta.
      const centro = new THREE.Vector3();
      cajaUnion.getCenter(centro);
      geometry.translate(-centro.x, -centro.y, -centro.z);
      const material = new THREE.MeshStandardMaterial({ color: 0xf1e3c8, metalness: 0.05, roughness: 0.5 });
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);
      const piezas = [{ mesh, etiqueta: nombre1 || 'Pieza 1' }];
      if (geometry2) {
        geometry2.translate(-centro.x, -centro.y, -centro.z);
        const material2 = new THREE.MeshStandardMaterial({ color: 0xf1e3c8, metalness: 0.05, roughness: 0.5 });
        const mesh2 = new THREE.Mesh(geometry2, material2);
        scene.add(mesh2);
        piezas.push({ mesh: mesh2, etiqueta: nombre2 || 'Pieza 2' });
      }
      const tam = new THREE.Vector3();
      cajaUnion.getSize(tam);
      const maxDim = Math.max(tam.x, tam.y, tam.z) || 1;
      camera.position.set(0, maxDim * 0.5, maxDim * 2.2);
      camera.lookAt(0, 0, 0);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.1;
      controls.update();
      (function animar() {
        if (!document.body.contains(cont)) return;
        requestAnimationFrame(animar);
        controls.update();
        renderer.render(scene, camera);
      })();
      if (trabajoId) {
        _agregarEscaneoContextoSTL(trabajoId, scene, centro, TOKEN ? { Authorization: `Bearer ${TOKEN}` } : {});
      }
      _agregarControlesVisibilidadSTL(contenedorId, piezas);
    } catch (e) {
      mostrarError('No se pudo mostrar la vista previa 3D — descarga el archivo para revisarlo.');
    }
  }

  async function _agregarEscaneoContextoSTL(trabajoId, scene, centroDiseno, headersPeticion) {
    // Complemento opcional del visor: si el trabajo viene de un pedido de DS
    // Core, trae también el escaneo completo (arriba/abajo) y lo agrega en la
    // MISMA escena, semi-transparente, para ver el diseño puesto en su lugar
    // real -- como hace Exocad. Si algo falla (trabajo sin DS Core, sin
    // conexión, sin la librería de zip, etc.) no se agrega nada más -- el
    // visor se queda mostrando solo la pieza de diseño, como siempre, sin
    // avisar ningún error (es un extra, no algo obligatorio para aprobar).
    if (typeof JSZip === 'undefined') return;
    let buffer;
    try {
      const r = await fetch(`/api/laboratorio/${trabajoId}/ver-escaneo-original`, { headers: headersPeticion });
      if (!r.ok) return;
      buffer = await r.arrayBuffer();
    } catch (e) { return; }
    let zip;
    try {
      zip = await JSZip.loadAsync(buffer);
    } catch (e) { return; }
    const materialEscaneo = new THREE.MeshStandardMaterial({
      color: 0xe3a99c, roughness: 0.9, metalness: 0,
      transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide,
    });
    for (const nombre of Object.keys(zip.files)) {
      const entrada = zip.files[nombre];
      if (entrada.dir || !/\.stl$/i.test(nombre)) continue;
      try {
        const stlBuffer = await entrada.async('arraybuffer');
        const geometryEscaneo = new THREE.STLLoader().parse(stlBuffer);
        geometryEscaneo.translate(-centroDiseno.x, -centroDiseno.y, -centroDiseno.z);
        scene.add(new THREE.Mesh(geometryEscaneo, materialEscaneo));
      } catch (e) { /* un archivo del zip que no cargó -- se ignora */ }
    }
  }

  function _agregarControlesVisibilidadSTL(contenedorId, piezas) {
    // Cuando el visor muestra 2 piezas de diseño juntas (ej. arcada
    // superior + inferior), agrega un checkbox por pieza para poder
    // ocultar/mostrar cada una por separado -- en un div HERMANO aparte
    // (no dentro del contenedor del visor) para no alterar el tamaño fijo
    // que usa el visor 3D para calcular su ancho/alto.
    const cont = document.getElementById(`${contenedorId}_controles`);
    if (!cont) return;
    if (piezas.length < 2) { cont.innerHTML = ''; return; }
    cont.innerHTML = piezas.map((p, i) => `
      <label style="font-size:12px; margin-right:14px; display:inline-flex; align-items:center; gap:4px; cursor:pointer;">
        <input type="checkbox" data-pieza-idx="${i}" checked />
        ${escapeHtml(p.etiqueta)}
      </label>
    `).join('');
    cont.querySelectorAll('input[type=checkbox]').forEach((chk) => {
      const pieza = piezas[Number(chk.dataset.piezaIdx)];
      chk.addEventListener('change', () => { pieza.mesh.visible = chk.checked; });
    });
  }

          `).join('') : '<p class="sub">Sin piezas todavía.</p>'}
          <h2>Escaneo</h2>
          ${(w.escaneos || []).length ? w.escaneos.map(e => `<p class="trabajo-meta">📎 ${escapeHtml(e.nombre_archivo)}${e.liberado ? ' (ya se borró al entregar)' : ''}</p>`).join('') : '<p class="sub" style="margin-bottom:8px;">No has subido tu escaneo.</p>'}
          ${['entregado', 'cancelado'].includes(w.estado) ? '' : `<label class="btn-file">📎 ${(w.escaneos || []).length ? 'Subir otro archivo' : 'Subir mi escaneo (STL, PLY o ZIP)'}<input type="file" accept=".stl,.ply,.zip,.obj,.dcm" style="display:none;" onchange="subirEscaneoDetalle(${w.id}, this)" /></label>`}
          <div class="error" id="escaneoError"></div>
        </div>
        ${_seccionPagoYFirma(w)}
        ${_seccionAprobarDiseno(w)}
      `;
      const canvas = document.getElementById('firmaCanvas');
      if (canvas) {
        FIRMA_VACIA = true;
        inicializarFirmaCanvas(canvas);
      }
      const disenosDetalle = w.disenos || [];
      const disenoActualDetalle = disenosDetalle.length ? disenosDetalle[disenosDetalle.length - 1] : null;
      if (disenoActualDetalle && disenoActualDetalle.estado === 'pendiente' && document.getElementById('visorSTL_estudiante')) {
        // El detalle ya no trae el contenido del STL (solo metadatos) --
        // se pide aparte para que abrir el trabajo no se tarde ni truene
        // con diseños grandes.
        try {
          const archivo = await api(`/api/laboratorio/${w.id}/disenos/${disenoActualDetalle.id}/archivo`);
          iniciarVisorSTL('visorSTL_estudiante', archivo.archivo_base64, w.dscore_order_name ? w.id : null, archivo.archivo_base64_2 || null, archivo.archivo_nombre, archivo.archivo_nombre_2);
          const descargas = document.getElementById('disenoDescargas');
          if (descargas) {
            descargas.innerHTML = `
              <a class="primary" style="display:block; text-align:center; text-decoration:none; margin-bottom:10px;" href="${archivo.archivo_base64}" download="${escapeHtml(archivo.archivo_nombre || 'diseno.stl')}">⬇️ Descargar diseño (STL)</a>
              ${archivo.archivo_base64_2 ? `<a class="primary" style="display:block; text-align:center; text-decoration:none; margin-bottom:10px;" href="${archivo.archivo_base64_2}" download="${escapeHtml(archivo.archivo_nombre_2 || 'diseno_2.stl')}">⬇️ Descargar segunda pieza (STL)</a>` : ''}
            `;
          }
        } catch (e) {
          const visor = document.getElementById('visorSTL_estudiante');
          if (visor) visor.innerHTML = '<p style="font-size:12px; color:var(--muted); padding:10px; margin:0;">No se pudo cargar el modelo 3D.</p>';
          const descargas = document.getElementById('disenoDescargas');
          if (descargas) descargas.innerHTML = `<p class="sub" style="font-size:12px; color:var(--muted);">No se pudo preparar la descarga: ${escapeHtml(e.message)}</p>`;
        }
      }
    } catch (e) {
      cont.innerHTML = `<div class="empty">${escapeHtml(e.message)}</div>`;
    }
  }

  function inicializarFirmaCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#EDEDED'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    const pos = (e) => {
      const r = canvas.getBoundingClientRect();
      const p = e.touches ? e.touches[0] : e;
      return { x: (p.clientX - r.left) * (canvas.width / r.width), y: (p.clientY - r.top) * (canvas.height / r.height) };
    };
    let dibujando = false;
    const empezar = (e) => { e.preventDefault(); dibujando = true; FIRMA_VACIA = false; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
    const dibujar = (e) => { if (!dibujando) return; e.preventDefault(); const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
    const terminar = () => { dibujando = false; };
    canvas.onmousedown = empezar; canvas.onmousemove = dibujar; canvas.onmouseup = terminar; canvas.onmouseleave = terminar;
    canvas.ontouchstart = empezar; canvas.ontouchmove = dibujar; canvas.ontouchend = terminar;
  }

  function limpiarFirma() {
    const canvas = document.getElementById('firmaCanvas');
    if (!canvas) return;
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
    FIRMA_VACIA = true;
  }

  async function subirComprobantePago(id, input) {
    const archivo = input.files[0];
    if (!archivo) return;
    const err = document.getElementById('pagoError');
    if (err) err.textContent = '';
    try {
      const comprobante_base64 = await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(archivo);
      });
      await api(`/api/laboratorio/mios/${id}/reportar-pago`, { method: 'POST', body: JSON.stringify({ comprobante_base64 }) });
      await verDetalle(id);
    } catch (e) {
      if (err) err.textContent = e.message;
    }
  }

  async function firmarRecepcion(id) {
    const err = document.getElementById('firmaError');
    if (FIRMA_VACIA) { err.textContent = 'Falta tu firma.'; return; }
    const firma_recepcion = document.getElementById('firmaCanvas').toDataURL('image/png');
    try {
      await api(`/api/laboratorio/${id}/firmar-recepcion`, { method: 'POST', body: JSON.stringify({ firma_recepcion }) });
      await verDetalle(id);
    } catch (e) {
      err.textContent = e.message;
    }
  }

  async function aprobarDisenoUI(trabajoId, disenoId) {
    const err = document.getElementById('disenoError');
    try {
      await api(`/api/laboratorio/${trabajoId}/disenos/${disenoId}/aprobar`, { method: 'POST' });
      await verDetalle(trabajoId);
    } catch (e) {
      if (err) err.textContent = e.message;
    }
  }

  async function rechazarDisenoUI(trabajoId, disenoId) {
    const err = document.getElementById('disenoError');
    const campoMotivo = document.getElementById('diseno_motivo_rechazo');
    const motivo = campoMotivo ? campoMotivo.value.trim() : '';
    try {
      await api(`/api/laboratorio/${trabajoId}/disenos/${disenoId}/rechazar`, { method: 'POST', body: JSON.stringify({ motivo: motivo || null }) });
      await verDetalle(trabajoId);
    } catch (e) {
      if (err) err.textContent = e.message;
    }
  }

  async function iniciar() {
    try {
      const info = await api(`/api/laboratorio/estudiantes/info/${CODIGO}`);
      document.getElementById('nombreEmpresaSub').textContent = `Portal de estudiantes — ${info.empresa_nombre}`;
    } catch (e) {
      document.getElementById('pantallaInvalida').style.display = 'block';
      return;
    }
    document.getElementById('app').classList.remove('hidden');
    const tokenGuardado = localStorage.getItem('lab_estudiante_token');
    if (tokenGuardado) {
      TOKEN = tokenGuardado;
      try {
        USUARIO = await api('/api/auth/me');
        if (USUARIO.rol !== 'estudiante') throw new Error('rol inválido');
        document.getElementById('saludoUsuario').textContent = `${USUARIO.nombre} · ${USUARIO.username}`;
        await cargarMeta();
        mostrarLista();
        return;
      } catch (e) {
        TOKEN = null;
        localStorage.removeItem('lab_estudiante_token');
      }
    }
    mostrarSolo('vistaAuth');
  }

  iniciar();
</script>
</body>
</html>
