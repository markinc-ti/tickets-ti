<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Soporte técnico</title>
<style>
  :root { --acento: #0E4C92; --tinta: #16181d; --gris: #5b5d62; --linea: #e3e6ec; --fondo: #f4f6fa; --ok: #1f8a5b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: var(--fondo); color: var(--tinta); }
  .barra { background: #fff; border-bottom: 3px solid var(--acento); padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .barra img { max-height: 46px; max-width: 160px; object-fit: contain; }
  .barra .emp { font-weight: 800; font-size: 17px; }
  .barra .sub { font-size: 12px; color: var(--gris); }
  main { max-width: 640px; margin: 0 auto; padding: 16px 16px 40px; }
  .tarjeta { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  h1 { font-size: 20px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--acento); text-transform: uppercase; letter-spacing: .03em; }
  .folio { display: inline-block; background: var(--acento); color: #fff; font-weight: 800; font-size: 12px; border-radius: 8px; padding: 3px 9px; }
  .estado { display: inline-block; font-size: 12px; font-weight: 700; color: var(--acento); background: rgba(14,76,146,.08); border-radius: 8px; padding: 3px 9px; margin-left: 6px; }
  dl { display: grid; grid-template-columns: 130px 1fr; gap: 6px 10px; margin: 0; font-size: 14px; }
  dt { color: var(--gris); font-size: 12px; text-transform: uppercase; padding-top: 2px; }
  dd { margin: 0; font-weight: 600; }
  p { line-height: 1.45; font-size: 15px; }
  .boton { display: block; width: 100%; border: 0; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 800; cursor: pointer; text-align: center; text-decoration: none; }
  .primario { background: var(--acento); color: #fff; }
  .secundario { background: #fff; color: var(--acento); border: 2px solid var(--acento); }
  .boton:disabled { opacity: .6; }
  input[type=text], textarea { width: 100%; font-size: 16px; padding: 12px; border: 1px solid #cfd4dc; border-radius: 10px; font-family: inherit; }
  canvas { width: 100%; height: 190px; background: #fff; border: 2px dashed #9aa3b2; border-radius: 12px; touch-action: none; display: block; }
  .fila { display: flex; gap: 10px; margin-top: 10px; }
  .fila > * { flex: 1; }
  .ok { color: var(--ok); font-weight: 800; }
  .error { color: #c62828; font-weight: 700; font-size: 14px; min-height: 18px; margin-top: 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td, th { text-align: left; padding: 7px 4px; border-bottom: 1px solid var(--linea); }
  th { font-size: 11px; color: var(--gris); text-transform: uppercase; }
  .estrellas { display: flex; gap: 6px; margin: 6px 0 14px; }
  .estrellas button { flex: 1; font-size: 28px; background: #fff; border: 1px solid var(--linea); border-radius: 10px; padding: 6px 0; cursor: pointer; color: #c9ced8; }
  .estrellas button.on { color: #f2a900; border-color: #f2a900; }
  .nps { display: grid; grid-template-columns: repeat(11, 1fr); gap: 4px; margin: 6px 0 14px; }
  .nps button { padding: 9px 0; font-size: 14px; font-weight: 700; border-radius: 8px; border: 1px solid var(--linea); background: #fff; cursor: pointer; }
  .nps button.on { background: var(--acento); color: #fff; border-color: var(--acento); }
  label.chk { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin: 10px 0; }
  .pie { text-align: center; font-size: 12px; color: var(--gris); margin-top: 20px; }
  @media (max-width: 420px) { dl { grid-template-columns: 1fr; } dt { padding-top: 6px; } .nps button { font-size: 12px; padding: 8px 0; } }
</style>
</head>
<body>
<div class="barra" id="barra"><div class="emp">Soporte técnico</div></div>
<main id="contenido"><div class="tarjeta">Cargando…</div></main>

<script>
const TOKEN = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
const API = `/api/publico/soporte/${encodeURIComponent(TOKEN)}`;
let D = null;
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fecha = (iso) => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' }); };

async function cargar() {
  try {
    const r = await fetch(API);
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || 'Este link no es válido.');
    D = await r.json();
  } catch (e) {
    document.getElementById('contenido').innerHTML = `<div class="tarjeta"><h1>No encontramos tu orden</h1><p>${esc(e.message)}</p></div>`;
    return;
  }
  if (D.color && /^#[0-9a-f]{3,6}$/i.test(D.color)) document.documentElement.style.setProperty('--acento', D.color);
  document.title = `${D.empresa || 'Soporte'} · ${D.folio}`;
  document.getElementById('barra').innerHTML = `${D.logo ? `<img src="${D.logo}" alt="">` : ''}<div><div class="emp">${esc(D.empresa || '')}</div><div class="sub">Soporte técnico</div></div>`;
  pintar();
}

function equipo() {
  return `<dl>
    <dt>Servicio</dt><dd>${esc(D.tipo_servicio)}</dd>
    <dt>Equipo</dt><dd>${esc(D.tipo_unidad || '—')}${D.modelo ? ' · ' + esc(D.modelo) : ''}</dd>
    <dt>No. de serie</dt><dd>${esc(D.numero_serie || '—')}</dd>
    <dt>Fecha</dt><dd>${fecha(D.fecha)}</dd>
  </dl>`;
}

function pintar() {
  const c = document.getElementById('contenido');
  let html = `<div class="tarjeta"><span class="folio">${esc(D.folio)}</span><span class="estado">${esc(D.estado)}</span>
    <h1 style="margin-top:10px;">Hola, ${esc(D.cliente_nombre)}</h1>${equipo()}
    <p style="margin-bottom:0;"><b>Problema reportado:</b><br>${esc(D.problema).replace(/\n/g, '<br>')}</p></div>`;
  if (!D.firmada) {
    html += `<div class="tarjeta"><h2>1. Revisa tu orden de servicio</h2>
      <a class="boton secundario" href="${API}/orden.pdf" target="_blank">📄 Ver orden de servicio (PDF)</a></div>
      <div class="tarjeta"><h2>2. Firma de conformidad</h2>
      <label style="font-size:13px; color:var(--gris);">Tu nombre completo</label>
      <input type="text" id="nombre" value="${esc(D.cliente_nombre)}" autocomplete="name" />
      <p style="font-size:13px; color:var(--gris); margin:12px 0 6px;">Firma aquí con tu dedo:</p>
      <canvas id="firma"></canvas>
      <button class="boton secundario" style="margin-top:8px; padding:9px; font-size:14px;" onclick="limpiar()">Borrar firma</button>
      <label class="chk"><input type="checkbox" id="acepto" /> <span>Revisé la orden de servicio y estoy de acuerdo con los datos, el problema reportado y las condiciones.</span></label>
      <button class="boton primario" id="btnFirmar" onclick="firmar()">✍️ Firmar orden</button>
      <div class="error" id="err"></div></div>`;
  } else {
    html += `<div class="tarjeta"><p class="ok" style="margin:0;">✔ Orden firmada por ${esc(D.firma_nombre)} el ${fecha(D.firma_en)}.</p>
      <a class="boton secundario" style="margin-top:12px;" href="${API}/orden.pdf" target="_blank">📄 Descargar orden firmada</a></div>`;
    if (!D.resolucion) {
      html += `<div class="tarjeta"><h2>¿Qué sigue?</h2><p style="margin:0;">Nuestro equipo de soporte está revisando tu equipo. Te avisaremos por WhatsApp en cuanto tengamos el diagnóstico.</p></div>`;
    }
  }
  if (D.resolucion) {
    const r = D.resolucion;
    const refac = (r.refacciones || []).filter(x => x.descripcion);
    html += `<div class="tarjeta"><h2>Diagnóstico</h2><p>${esc(r.diagnostico).replace(/\n/g, '<br>')}</p>
      ${refac.length ? `<h2 style="margin-top:14px;">Refacciones</h2><table><tr><th>Cant.</th><th>Descripción</th><th>No. de parte</th></tr>
        ${refac.map(x => `<tr><td>${esc(x.cantidad)}</td><td>${esc(x.descripcion)}</td><td>${esc(x.numero_parte || '—')}</td></tr>`).join('')}</table>` : ''}
      <h2 style="margin-top:14px;">Qué se va a hacer</h2><p>${esc(r.resolucion).replace(/\n/g, '<br>')}</p>
      <h2 style="margin-top:14px;">Envío</h2><dl><dt>Paquetería</dt><dd>${esc(r.paqueteria || 'Por confirmar')}</dd>
      <dt>Ocurre</dt><dd>${r.ocurre === true ? 'Sí — lo recoges en la sucursal de la paquetería' : r.ocurre === false ? 'No — se entrega en tu domicilio' : 'Por confirmar'}</dd></dl>
      <a class="boton secundario" style="margin-top:14px;" href="${API}/resolucion.pdf" target="_blank">📄 Descargar diagnóstico (PDF)</a></div>`;
    if (D.encuesta_pendiente) {
      html += `<div class="tarjeta" id="encuesta"><h2>⭐ Encuesta de satisfacción</h2>
        <p style="margin-top:0;">Nos ayuda mucho saber cómo te fue. Son 4 preguntas.</p>
        <b>¿Qué tan satisfecho estás con tu equipo (producto)?</b><div class="estrellas" data-k="satisfaccion_producto"></div>
        <b>¿Cómo calificas la atención de soporte?</b><div class="estrellas" data-k="atencion"></div>
        <b>¿Qué tan rápido resolvimos?</b><div class="estrellas" data-k="rapidez"></div>
        <b>Del 0 al 10, ¿nos recomendarías?</b><div class="nps" data-k="recomendaria"></div>
        <b>Comentarios (opcional)</b><textarea id="comentarios" rows="3"></textarea>
        <button class="boton primario" style="margin-top:12px;" onclick="enviarEncuesta(this)">Enviar encuesta</button>
        <div class="error" id="errEnc"></div></div>`;
    } else if (D.encuesta_contestada) {
      html += `<div class="tarjeta"><p class="ok" style="margin:0;">⭐ ¡Gracias por contestar la encuesta!</p></div>`;
    }
  }
  html += `<div class="pie">${esc(D.empresa || '')} · Soporte técnico</div>`;
  c.innerHTML = html;
  if (!D.firmada) prepararFirma();
  if (D.resolucion && D.encuesta_pendiente) prepararEncuesta();
}

// ---- Firma ----
let ctx = null, vacia = true, pintando = false;
function prepararFirma() {
  const cv = document.getElementById('firma');
  const ajustar = () => {
    const k = window.devicePixelRatio || 1;
    cv.width = cv.clientWidth * k; cv.height = cv.clientHeight * k;
    ctx = cv.getContext('2d'); ctx.scale(k, k); limpiar();
  };
  ajustar();
  const pos = (e) => { const b = cv.getBoundingClientRect(); const t = e.touches ? e.touches[0] : e; return { x: t.clientX - b.left, y: t.clientY - b.top }; };
  const ini = (e) => { e.preventDefault(); pintando = true; const p = pos(e); ctx.beginPath(); ctx.moveTo(p.x, p.y); };
  const mov = (e) => { if (!pintando) return; e.preventDefault(); vacia = false; const p = pos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
  const fin = () => { pintando = false; };
  cv.addEventListener('mousedown', ini); cv.addEventListener('mousemove', mov); window.addEventListener('mouseup', fin);
  cv.addEventListener('touchstart', ini, { passive: false }); cv.addEventListener('touchmove', mov, { passive: false }); cv.addEventListener('touchend', fin);
}
function limpiar() {
  const cv = document.getElementById('firma');
  ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.restore();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2.6; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  vacia = true;
}
async function firmar() {
  const err = document.getElementById('err'); err.textContent = '';
  const nombre = document.getElementById('nombre').value.trim();
  if (nombre.length < 3) { err.textContent = 'Escribe tu nombre completo.'; return; }
  if (vacia) { err.textContent = 'Falta tu firma en el recuadro.'; return; }
  if (!document.getElementById('acepto').checked) { err.textContent = 'Marca la casilla de conformidad.'; return; }
  const btn = document.getElementById('btnFirmar'); btn.disabled = true; btn.textContent = 'Enviando…';
  try {
    const r = await fetch(`${API}/firmar`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nombre, firma_base64: document.getElementById('firma').toDataURL('image/png') }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || 'No se pudo guardar la firma.');
    await cargar();
    window.scrollTo(0, 0);
  } catch (e) { err.textContent = e.message; btn.disabled = false; btn.textContent = '✍️ Firmar orden'; }
}

// ---- Encuesta ----
const RESP = {};
function prepararEncuesta() {
  document.querySelectorAll('.estrellas').forEach(cont => {
    const k = cont.dataset.k;
    cont.innerHTML = [1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" aria-label="${n} de 5">★</button>`).join('');
    cont.querySelectorAll('button').forEach(b => b.onclick = () => {
      RESP[k] = +b.dataset.n;
      cont.querySelectorAll('button').forEach(x => x.classList.toggle('on', +x.dataset.n <= RESP[k]));
    });
  });
  const nps = document.querySelector('.nps');
  nps.innerHTML = Array.from({ length: 11 }, (_, n) => `<button type="button" data-n="${n}">${n}</button>`).join('');
  nps.querySelectorAll('button').forEach(b => b.onclick = () => {
    RESP.recomendaria = +b.dataset.n;
    nps.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  });
}
async function enviarEncuesta(btn) {
  const err = document.getElementById('errEnc'); err.textContent = '';
  for (const k of ['satisfaccion_producto', 'atencion', 'rapidez', 'recomendaria']) {
    if (RESP[k] === undefined) { err.textContent = 'Contesta las 4 preguntas, por favor.'; return; }
  }
  btn.disabled = true;
  try {
    const r = await fetch(`${API}/encuesta`, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...RESP, comentarios: document.getElementById('comentarios').value.trim() || null }) });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || 'No se pudo enviar.');
    await cargar();
  } catch (e) { err.textContent = e.message; btn.disabled = false; }
}

cargar();
</script>
</body>
</html>
